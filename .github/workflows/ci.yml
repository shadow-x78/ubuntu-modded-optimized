name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  shellcheck:
    name: Shellcheck (POSIX sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint runnable shell scripts
        run: |
          # Excluded codes (intentional patterns in this codebase):
          #   SC1091  dynamic . source of $UMO_LIB_DIR modules
          #   SC2034  variables exported for sourcing consumers
          #   SC2059  printf format strings hold color variables on purpose
          #   SC2016  single-quoted strings are literal by design
          #   SC2317  trap handlers / indirect calls look unreachable
          #   SC2153/SC2154  vars assigned through loops or eval indirection
          #   SC2086  quoted words would break intentional splitting
          #
          # config/templates/*.sh and config/xstartup are NOT linted:
          # they contain {{PLACEHOLDER}} tokens expanded at install time
          # and will not parse as valid shell until rendered.
          shellcheck -s sh \
            -e SC1091,SC2034,SC2059,SC2016,SC2317,SC2153,SC2154,SC2086 \
            install.sh \
            bin/umo-install bin/umo-start bin/umo-stop \
            lib/*.sh \
            modules/*.sh \
            scripts/*.sh

  syntax:
    name: Syntax check (sh -n)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify POSIX sh syntax
        run: |
          for f in install.sh bin/umo-install bin/umo-start bin/umo-stop \
                   lib/*.sh modules/*.sh config/xstartup \
                   config/templates/*.sh scripts/*.sh; do
            sh -n "$f" || exit 1
          done
          echo "All scripts parse cleanly"

  security:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for hardcoded secrets
        run: |
          # Private keys and obvious API keys only; generic words like
          # "password" appear in legitimate UI code (e.g. umo_ui_password)
          # and VNC documentation, so they are excluded by design.
          if grep -rInE '(BEGIN [A-Z ]*PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36,}|xox[baprs]-[A-Za-z0-9-]+)' \
               bin lib modules config scripts install.sh 2>/dev/null; then
            echo "::error::Potential secret found in tree"
            exit 1
          fi
          echo "No secrets detected"
