name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  shellcheck:
    name: Shellcheck (POSIX sh)
    runs-on: ubuntu-latest
    # Informative only until the pre-existing warnings are triaged;
    # new scripts added to the tree must still be shellcheck-clean.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint all shell scripts
        run: |
          shellcheck -s sh \
            -e SC1091 \
            install.sh \
            bin/umo-install bin/umo-start bin/umo-stop \
            lib/*.sh \
            modules/*.sh \
            config/xstartup \
            config/templates/*.sh \
            scripts/*.sh

  syntax:
    name: Syntax check (sh -n)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify POSIX sh syntax
        run: |
          for f in install.sh bin/umo-install bin/umo-start bin/umo-stop \
                   lib/*.sh modules/*.sh config/xstartup \
                   config/templates/*.sh scripts/*.sh; do
            sh -n "$f" || exit 1
          done
          echo "All scripts parse cleanly"

  security:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for hardcoded secrets
        run: |
          # Private keys and obvious API keys only; generic words like
          # "password" appear in legitimate UI code (e.g. umo_ui_password)
          # and VNC documentation, so they are excluded by design.
          if grep -rInE '(BEGIN [A-Z ]*PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36,}|xox[baprs]-[A-Za-z0-9-]+)' \
               bin lib modules config scripts install.sh 2>/dev/null; then
            echo "::error::Potential secret found in tree"
            exit 1
          fi
          echo "No secrets detected"
