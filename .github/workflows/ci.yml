name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    name: Shellcheck (POSIX sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint runnable shell scripts
        run: |
          shellcheck -s sh \
            -e SC1091,SC2034,SC2059,SC2016,SC2317,SC2153,SC2154,SC2086 \
            install.sh umo.sh \
            bin/umo-install bin/umo-start bin/umo-stop \
            lib/*.sh \
            modules/*.sh

  syntax:
    name: Syntax check (sh -n)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify POSIX sh syntax
        run: |
          for f in install.sh umo.sh bin/umo-install bin/umo-start bin/umo-stop \
                   lib/*.sh modules/*.sh config/xstartup \
                   config/templates/*.sh; do
            sh -n "$f" || exit 1
          done
          echo "All scripts parse cleanly"

  security:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan for hardcoded secrets
        run: |
          if grep -rInE '(BEGIN [A-Z ]*PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36,}|xox[baprs]-[A-Za-z0-9-]+)' \
               bin lib modules config install.sh 2>/dev/null; then
            echo "::error::Potential secret found in tree"
            exit 1
          fi
          echo "No secrets detected"
